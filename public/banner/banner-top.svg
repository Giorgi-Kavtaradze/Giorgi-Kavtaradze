<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 140" width="1708" height="280">
  <defs>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="25%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="75%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <style>
      @keyframes wave1 {
        0%   { d: path("M0 0L0 60Q213.5 20 427 50T854 25L854 0Z"); }
        33%  { d: path("M0 0L0 35Q213.5 20 427 40T854 50L854 0Z"); }
        66%  { d: path("M0 0L0 15Q213.5 45 427 15T854 50L854 0Z"); }
        100% { d: path("M0 0L0 60Q213.5 20 427 50T854 25L854 0Z"); }
      }
      @keyframes wave2 {
        0%   { d: path("M0 0L0 45Q213.5 0 427 30T854 20L854 0Z"); }
        33%  { d: path("M0 0L0 30Q213.5 60 427 60T854 40L854 0Z"); }
        66%  { d: path("M0 0L0 35Q213.5 55 427 30T854 15L854 0Z"); }
        100% { d: path("M0 0L0 45Q213.5 0 427 30T854 20L854 0Z"); }
      }
      .wave1 {
        fill: url(#wave-gradient);
        opacity: 0.45;
        animation: wave1 20s ease-in-out infinite;
      }
      .wave2 {
        fill: url(#wave-gradient);
        opacity: 0.30;
        animation: wave2 20s ease-in-out infinite;
        animation-delay: -10s;
      }
      @keyframes twinkle  { 0%,100%{opacity:.6} 50%{opacity:.1} }
      @keyframes twinkle2 { 0%,100%{opacity:.4} 50%{opacity:.05} }
      @keyframes twinkle3 { 0%,100%{opacity:.25} 50%{opacity:.05} }
      .s1 { animation: twinkle  6s ease-in-out infinite; }
      .s2 { animation: twinkle2 9s ease-in-out infinite; animation-delay:-3s; }
      .s3 { animation: twinkle3 12s ease-in-out infinite; animation-delay:-6s; }
      @keyframes shimmer {
        0%   { stop-color: #00F7FF; }
        25%  { stop-color: #8B5CF6; }
        50%  { stop-color: #F43F5E; }
        75%  { stop-color: #0EA5E9; }
        100% { stop-color: #00F7FF; }
      }
      @keyframes twinkle-text {
        40% { opacity: 1;    }
        50% { opacity: 0.55; }
        60% { opacity: 1;    }
        70% { opacity: 0.55; }
        80% { opacity: 1;    }
      }
      .hero-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: 62px;
        letter-spacing: -2px;
        fill: url(#wave-gradient);
        animation: twinkle-text 4s ease-in-out infinite;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: rgba(255,255,255,0.6);
        letter-spacing: 0.5px;
      }
      @media (prefers-color-scheme: light) {
        .sub-text { fill: rgba(30, 41, 59, 0.55); }
      }
    </style>
  </defs>
  <g class="s1">
    <circle cx="85" cy="105" r="1" fill="white" />
    <circle cx="257" cy="65" r="1" fill="white" />
