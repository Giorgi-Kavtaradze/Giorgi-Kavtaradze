<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 182" width="1708" height="364"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="25%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="75%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <style>
      @keyframes wave1 {
        0%   { d: path("M0 0L0 60Q213.5 20 427 50T854 25L854 0Z"); }
        33%  { d: path("M0 0L0 35Q213.5 20 427 40T854 50L854 0Z"); }
        66%  { d: path("M0 0L0 15Q213.5 45 427 15T854 50L854 0Z"); }
        100% { d: path("M0 0L0 60Q213.5 20 427 50T854 25L854 0Z"); }
      }
      @keyframes wave2 {
        0%   { d: path("M0 0L0 45Q213.5 0 427 30T854 20L854 0Z"); }
        33%  { d: path("M0 0L0 30Q213.5 60 427 60T854 40L854 0Z"); }
        66%  { d: path("M0 0L0 35Q213.5 55 427 30T854 15L854 0Z"); }
        100% { d: path("M0 0L0 45Q213.5 0 427 30T854 20L854 0Z"); }
      }
      .wave1 {
        fill: url(#wave-gradient);
        opacity: 0.45;
        animation: wave1 20s ease-in-out infinite;
      }
      .wave2 {
        fill: url(#wave-gradient);
        opacity: 0.30;
        animation: wave2 20s ease-in-out infinite;
        animation-delay: -10s;
      }
      @keyframes twinkle  { 0%,100%{opacity:.6} 50%{opacity:.1} }
      @keyframes twinkle2 { 0%,100%{opacity:.4} 50%{opacity:.05} }
      @keyframes twinkle3 { 0%,100%{opacity:.25} 50%{opacity:.05} }
      .s1 { animation: twinkle  6s ease-in-out infinite; }
      .s2 { animation: twinkle2 9s ease-in-out infinite; animation-delay:-3s; }
      .s3 { animation: twinkle3 12s ease-in-out infinite; animation-delay:-6s; }
      @keyframes shimmer {
        0%   { stop-color: #00F7FF; }
        25%  { stop-color: #8B5CF6; }
        50%  { stop-color: #F43F5E; }
        75%  { stop-color: #0EA5E9; }
        100% { stop-color: #00F7FF; }
      }
      /* hero-banner content styles */
      @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes dash-flow { to { stroke-dashoffset: -80; } }
      @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes twinkle-hero { 0%,100% { opacity: .5; } 50% { opacity: .12; } }
      .orbit-spin { animation: spin-slow 24s linear infinite; transform-origin: 95px 95px; }
      .flow { stroke-dasharray: 10 14; animation: dash-flow 3s linear infinite; }
      .pulse { animation: pulse-dot 2.6s ease-in-out infinite; }
      .tw { animation: twinkle-hero 5s ease-in-out infinite; }
      .hb-name { font-size: 90px; font-weight: 800; letter-spacing: -3px; fill: url(#brand-grad-h); }
      .hb-role { font-size: 32px; font-weight: 700; letter-spacing: 6px; fill: #CBD5E1; }
      .hb-site { font-size: 24px; font-weight: 500; letter-spacing: 1px; fill: #94A3B8; }
      @media (prefers-color-scheme: light) {
        .hb-role { fill: #334155; }
        .hb-site { fill: #475569; }
      }
      .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }
    </style>
    <!-- hero-banner content defs -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="brand-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="25%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="75%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2E" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="glyph-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </linearGradient>
    <mask id="fade-mask" maskUnits="userSpaceOnUse" x="700" y="0" width="1300" height="380">
      <rect x="700" y="0" width="1300" height="380" fill="url(#fade)" />
    </mask>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#8B5CF6" flood-opacity="0.55" />
    </filter>
    <filter id="glow-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00F7FF" flood-opacity="0.5" />
    </filter>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <pattern id="circuit" width="160" height="160" patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)">
      <g fill="none" stroke="#334155" stroke-width="2.5">
        <path d="M20 20 h50 v50 h50" />
        <path d="M110 20 v40 h30" />
        <path d="M20 110 h30 v30 h40" />
        <path d="M140 110 h-20 v-20" />
        <circle cx="120" cy="70" r="7" />
        <circle cx="90" cy="140" r="7" />
      </g>
      <g fill="#334155">
        <circle cx="120" cy="70" r="4" />
        <circle cx="90" cy="140" r="4" />
      </g>
      <g fill="none" stroke="#94A3B8" stroke-width="2" opacity="0.5">
        <path d="M60 60 h20 v20" />
        <circle cx="60" cy="140" r="9" />
      </g>
    </pattern>
    <!-- /hero-banner content defs -->
  </defs>
  <g class="s1">
    <circle cx="85" cy="105" r="1" fill="white" />
    <circle cx="257" cy="65" r="1" fill="white" />
    <circle cx="470" cy="107" r="1" fill="white" />
    <circle cx="598" cy="53" r="1" fill="white" />
    <circle cx="726" cy="109" r="1" fill="white" />
    <circle cx="171" cy="36" r="1" fill="white" />
    <circle cx="384" cy="18" r="1" fill="white" />
    <circle cx="769" cy="105" r="1" fill="white" />
    <circle cx="512" cy="65" r="1" fill="white" />
    <circle cx="43" cy="70" r="1" fill="white" />
    <circle cx="95" cy="126" r="1" fill="white" />
    <circle cx="735" cy="121" r="1" fill="white" />
  </g>
  <g class="s2">
    <circle cx="128" cy="108" r="1.5" fill="white" />
    <circle cx="342" cy="107" r="1.5" fill="white" />
    <circle cx="555" cy="35" r="1.5" fill="white" />
    <circle cx="683" cy="79" r="1.5" fill="white" />
    <circle cx="214" cy="61" r="1.5" fill="white" />
    <circle cx="427" cy="105" r="1.5" fill="white" />
    <circle cx="786" cy="99" r="1.5" fill="white" />
    <circle cx="68" cy="86" r="1.5" fill="white" />
    <circle cx="48" cy="122" r="1.5" fill="white" />
    <circle cx="796" cy="127" r="1.5" fill="white" />
  </g>
  <g class="s3">
    <circle cx="188" cy="98" r="2" fill="white" />
    <circle cx="667" cy="108" r="2" fill="white" />
    <circle cx="427" cy="44" r="2" fill="white" />
    <circle cx="299" cy="104" r="2" fill="white" />
    <circle cx="812" cy="18" r="2" fill="white" />
    <circle cx="130" cy="127" r="2" fill="white" />
  </g>
  <path class="wave1" d="M0 0L0 60Q213.5 20 427 50T854 25L854 0Z" />
  <path class="wave2" d="M0 0L0 45Q213.5 0 427 30T854 20L854 0Z" />
  <!-- hero-banner content body -->
  <g transform="translate(0,40)">
    <g transform="scale(0.427)">
      <g mask="url(#fade-mask)">
        <rect x="700" y="0" width="1300" height="380" fill="url(#circuit)" opacity="0.28" />
      </g>
      <g>
        <rect x="1460" y="70" width="34" height="34" rx="6" fill="#F43F5E"
          transform="rotate(45 1477 87)" />
        <rect x="1850" y="110" width="30" height="30" rx="6" fill="#0EA5E9"
          transform="rotate(45 1865 125)" />
        <rect x="1560" y="250" width="30" height="30" rx="6" fill="#EC4899"
          transform="rotate(45 1575 265)" />
        <rect x="1740" y="300" width="24" height="24" rx="5" fill="#F43F5E"
