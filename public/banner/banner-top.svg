        <circle class="tw" cx="420" cy="160" r="2.5" style="animation-delay:-0.9s" />
        <circle class="tw" cx="560" cy="230" r="3" style="animation-delay:-2.5s" />
        <circle class="tw" cx="380" cy="330" r="3" style="animation-delay:-1.1s" />
        <circle class="tw" cx="540" cy="350" r="3.5" style="animation-delay:-3.6s" />
        <circle class="tw" cx="640" cy="180" r="2.5" style="animation-delay:-0.3s" />
      </g>
      <g transform="translate(120,85)" filter="url(#card-shadow)">
        <rect x="-14" y="-14" width="218" height="218" rx="56" fill="url(#brand-grad)"
          opacity="0.35" filter="url(#glow)" />
        <g filter="url(#glow-soft)">
          <rect width="190" height="190" rx="46" fill="url(#glass-grad)" stroke="url(#brand-grad-h)"
            stroke-width="2.5" />
        </g>
        <rect x="10" y="10" width="170" height="86" rx="38" fill="#FFFFFF" opacity="0.06" />
        <g class="orbit-spin" opacity="0.9">
          <circle cx="95" cy="95" r="82" fill="none" stroke="url(#brand-grad-h)" stroke-width="1.5"
            class="flow" opacity="0.7" />
          <circle cx="95" cy="13" r="5" fill="#00F7FF" class="pulse" />
          <circle cx="177" cy="95" r="4" fill="#EC4899" class="pulse" style="animation-delay:-1s" />
          <circle cx="95" cy="177" r="3.5" fill="#8B5CF6" class="pulse" style="animation-delay:-2s" />
        </g>
        <g fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.45">
          <path d="M30 40 h28 v22" />
          <path d="M160 150 h-28 v-22" />
          <circle cx="30" cy="40" r="3.5" fill="#00F7FF" stroke="none" />
          <circle cx="160" cy="150" r="3.5" fill="#EC4899" stroke="none" />
        </g>
        <text x="95" y="118" text-anchor="middle" font-size="74" font-weight="800"
          letter-spacing="2"
          fill="url(#glyph-grad)">GK</text>
        <g transform="translate(58,138)">
          <rect width="74" height="30" rx="15" fill="#0F172A" opacity="0.55" />
          <text x="37" y="21" text-anchor="middle" font-size="17" class="mono" fill="#00F7FF">
            &lt;/&gt;</text>
