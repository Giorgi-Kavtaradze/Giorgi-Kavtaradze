      <g fill="#FFFFFF" opacity="0.6">
        <circle class="tw" cx="760" cy="40" r="3" />
        <circle class="tw" cx="900" cy="60" r="3" style="animation-delay:-1.2s" />
        <circle class="tw" cx="1050" cy="30" r="2.5" style="animation-delay:-2.4s" />
