        <circle class="tw" cx="1230" cy="280" r="2.5" style="animation-delay:-3.7s" />
        <circle class="tw" cx="1400" cy="240" r="3.5" style="animation-delay:-0.5s" />
        <circle class="tw" cx="1560" cy="290" r="3" style="animation-delay:-2.3s" />
        <circle class="tw" cx="1720" cy="250" r="2.5" style="animation-delay:-1.4s" />
        <circle class="tw" cx="1870" cy="300" r="3" style="animation-delay:-3.9s" />
        <circle class="tw" cx="900" cy="330" r="3.5" style="animation-delay:-0.7s" />
        <circle class="tw" cx="1100" cy="360" r="2.5" style="animation-delay:-2.6s" />
        <circle class="tw" cx="1330" cy="340" r="3" style="animation-delay:-1.7s" />
        <circle class="tw" cx="1600" cy="360" r="3.5" style="animation-delay:-3.2s" />
        <circle class="tw" cx="1820" cy="340" r="2.5" style="animation-delay:-2s" />
        <!-- left-side stars -->
        <circle class="tw" cx="60" cy="50" r="3" style="animation-delay:-1.3s" />
        <circle class="tw" cx="180" cy="30" r="2.5" style="animation-delay:-2.8s" />
        <circle class="tw" cx="330" cy="55" r="3" style="animation-delay:-0.6s" />
        <circle class="tw" cx="480" cy="35" r="3.5" style="animation-delay:-3.4s" />
