<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 60" width="1708" height="120">
  <defs>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00F7FF"/>
      <stop offset="25%"  stop-color="#0EA5E9"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="75%"  stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <style>
      /* wave paths */
      @keyframes wave1 {
        0%   { d: path("M0 60L0 0Q213.5 40 427 10T854 35L854 60Z"); }
        33%  { d: path("M0 60L0 25Q213.5 40 427 20T854 10L854 60Z"); }
        66%  { d: path("M0 60L0 45Q213.5 15 427 45T854 10L854 60Z"); }
        100% { d: path("M0 60L0 0Q213.5 40 427 10T854 35L854 60Z"); }
      }
      @keyframes wave2 {
        0%   { d: path("M0 60L0 15Q213.5 60 427 30T854 40L854 60Z"); }
        33%  { d: path("M0 60L0 30Q213.5 0 427 0T854 20L854 60Z"); }
        66%  { d: path("M0 60L0 25Q213.5 5 427 30T854 45L854 60Z"); }
        100% { d: path("M0 60L0 15Q213.5 60 427 30T854 40L854 60Z"); }
      }
      .wave1 {
        fill: url(#wave-gradient);
        opacity: 0.45;
        animation: wave1 20s ease-in-out infinite;
      }
      .wave2 {
        fill: url(#wave-gradient);
        opacity: 0.30;
        animation: wave2 20s ease-in-out infinite;
        animation-delay: -10s;
      }

      /* falling snow */
      @keyframes snowfall {
        from { transform: translate(0, -70px); }
        to   { transform: translate(6px, 70px); }
      }
      @keyframes snowfall-alt {
        from { transform: translate(0, -70px); }
        to   { transform: translate(-6px, 70px); }
      }
      .flake {
        animation: snowfall 8s linear infinite;
      }
      .flake.alt {
        animation-name: snowfall-alt;
      }

      /* hero text */
      @keyframes shimmer {
        0%   { stop-color: #00F7FF; }
        25%  { stop-color: #8B5CF6; }
        50%  { stop-color: #F43F5E; }
        75%  { stop-color: #0EA5E9; }
        100% { stop-color: #00F7FF; }
      }
      @keyframes twinkle-text {
        40% { opacity: 1;    }
        50% { opacity: 0.55; }
        60% { opacity: 1;    }
        70% { opacity: 0.55; }
        80% { opacity: 1;    }
      }
      .hero-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: 80px;
        letter-spacing: -2px;
        fill: url(#wave-gradient);
        animation: twinkle-text 4s ease-in-out infinite;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: rgba(255,255,255,0.6);
        letter-spacing: 0.5px;
      }

      /* banner background is transparent now - keep subtitle readable on light themes */
      @media (prefers-color-scheme: light) {
        .sub-text { fill: rgba(30, 41, 59, 0.55); }
      }
    </style>
  </defs>

  <!-- Falling snow (top -> bottom) -->
  <g fill="white">
    <circle class="flake"     cx="12"  cy="8"  r="0.5"  opacity=".35" style="animation-duration:10s;animation-delay:-2s"/>
    <circle class="flake alt" cx="34"  cy="44" r="0.9"  opacity=".7"  style="animation-duration:6.5s;animation-delay:-5s"/>
    <circle class="flake"     cx="55"  cy="20" r="0.4"  opacity=".25" style="animation-duration:12s;animation-delay:-7s"/>
    <circle class="flake"     cx="76"  cy="33" r="0.7"  opacity=".5"  style="animation-duration:8s;animation-delay:-1s"/>
    <circle class="flake alt" cx="95"  cy="52" r="1"    opacity=".8"  style="animation-duration:5.5s;animation-delay:-3s"/>
    <circle class="flake"     cx="118" cy="14" r="0.5"  opacity=".3"  style="animation-duration:11s;animation-delay:-9s"/>
    <circle class="flake"     cx="140" cy="40" r="0.8"  opacity=".6"  style="animation-duration:7s;animation-delay:-4.5s"/>
    <circle class="flake alt" cx="163" cy="5"  r="0.6"  opacity=".4"  style="animation-duration:9.5s;animation-delay:-6s"/>
    <circle class="flake"     cx="185" cy="27" r="0.45" opacity=".3"  style="animation-duration:12.5s;animation-delay:-10s"/>
    <circle class="flake"     cx="208" cy="50" r="1.1"  opacity=".85" style="animation-duration:5s;animation-delay:-1.5s"/>
    <circle class="flake alt" cx="230" cy="18" r="0.5"  opacity=".35" style="animation-duration:10.5s;animation-delay:-8s"/>
    <circle class="flake"     cx="252" cy="36" r="0.7"  opacity=".55" style="animation-duration:7.5s;animation-delay:-2.5s"/>
    <circle class="flake"     cx="275" cy="57" r="0.4"  opacity=".25" style="animation-duration:13s;animation-delay:-11s"/>
    <circle class="flake alt" cx="298" cy="11" r="0.9"  opacity=".7"  style="animation-duration:6.8s;animation-delay:-4s"/>
    <circle class="flake"     cx="320" cy="24" r="0.5"  opacity=".3"  style="animation-duration:11.5s;animation-delay:-7.5s"/>
    <circle class="flake"     cx="342" cy="45" r="0.75" opacity=".5"  style="animation-duration:8.5s;animation-delay:-0.8s"/>
    <circle class="flake alt" cx="365" cy="2"  r="0.55" opacity=".35" style="animation-duration:10.2s;animation-delay:-5.2s"/>
    <circle class="flake"     cx="388" cy="30" r="1"    opacity=".8"  style="animation-duration:5.2s;animation-delay:-2.2s"/>
    <circle class="flake alt" cx="410" cy="47" r="0.45" opacity=".3"  style="animation-duration:12.2s;animation-delay:-9.5s"/>
    <circle class="flake"     cx="432" cy="16" r="0.7"  opacity=".55" style="animation-duration:7.2s;animation-delay:-3.8s"/>
    <circle class="flake"     cx="455" cy="55" r="0.5"  opacity=".35" style="animation-duration:9.8s;animation-delay:-6.8s"/>
    <circle class="flake alt" cx="478" cy="26" r="0.85" opacity=".65" style="animation-duration:6.2s;animation-delay:-0.5s"/>
    <circle class="flake"     cx="500" cy="8"  r="0.4"  opacity=".25" style="animation-duration:12.8s;animation-delay:-10.5s"/>
    <circle class="flake"     cx="522" cy="38" r="0.6"  opacity=".45" style="animation-duration:8.8s;animation-delay:-4.2s"/>
    <circle class="flake alt" cx="545" cy="20" r="1"    opacity=".8"  style="animation-duration:5.8s;animation-delay:-2.8s"/>
    <circle class="flake"     cx="568" cy="50" r="0.5"  opacity=".3"  style="animation-duration:11.2s;animation-delay:-8.8s"/>
    <circle class="flake"     cx="590" cy="34" r="0.7"  opacity=".5"  style="animation-duration:7.6s;animation-delay:-1.2s"/>
    <circle class="flake alt" cx="612" cy="4"  r="0.55" opacity=".35" style="animation-duration:10.8s;animation-delay:-6.4s"/>
    <circle class="flake"     cx="635" cy="42" r="0.9"  opacity=".7"  style="animation-duration:5.4s;animation-delay:-3.2s"/>
    <circle class="flake"     cx="658" cy="15" r="0.45" opacity=".3"  style="animation-duration:12.4s;animation-delay:-9.2s"/>
    <circle class="flake alt" cx="680" cy="55" r="0.65" opacity=".45" style="animation-duration:8.2s;animation-delay:-5.8s"/>
    <circle class="flake"     cx="702" cy="28" r="1"    opacity=".8"  style="animation-duration:5.6s;animation-delay:-0.6s"/>
    <circle class="flake alt" cx="725" cy="10" r="0.5"  opacity=".35" style="animation-duration:11.8s;animation-delay:-7.2s"/>
    <circle class="flake"     cx="748" cy="38" r="0.75" opacity=".55" style="animation-duration:7.4s;animation-delay:-2s"/>
    <circle class="flake"     cx="770" cy="52" r="0.45" opacity=".3"  style="animation-duration:12.6s;animation-delay:-10.2s"/>
    <circle class="flake alt" cx="792" cy="22" r="0.9"  opacity=".7"  style="animation-duration:6.4s;animation-delay:-4.8s"/>
    <circle class="flake"     cx="815" cy="44" r="0.55" opacity=".4"  style="animation-duration:9.2s;animation-delay:-1.8s"/>
    <circle class="flake alt" cx="838" cy="6"  r="0.7"  opacity=".5"  style="animation-duration:8.6s;animation-delay:-6.2s"/>
    <circle class="flake alt" cx="48"  cy="58" r="0.5"  opacity=".3"  style="animation-duration:11.4s;animation-delay:-8.4s"/>
    <circle class="flake alt" cx="250" cy="5"  r="0.65" opacity=".45" style="animation-duration:9.4s;animation-delay:-3.4s"/>
  </g>

  <!-- Animated wave paths (bottom) -->
  <path class="wave1" d="M0 60L0 0Q213.5 40 427 10T854 35L854 60Z"/>
  <path class="wave2" d="M0 60L0 15Q213.5 60 427 30T854 40L854 60Z"/>
</svg>